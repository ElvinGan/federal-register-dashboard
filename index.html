<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Federal Register documents</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1d2733; }
  header { background: #fff; border-bottom: 1px solid #dde2e8; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  header small { color: #5d6b7a; display: block; font-size: 13px; }
  select { font: inherit; padding: 6px 8px; }
  main { max-width: 1200px; margin: 20px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #fff; border: 1px solid #dde2e8; border-radius: 8px; padding: 16px; min-width: 0; }
  .wide { grid-column: 1 / -1; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .box { position: relative; height: 300px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Federal Register documents</h1>
    <small id="summary">Loading...</small>
  </div>
  <label>Document type
    <select id="type"><option value="">All types</option></select>
  </label>
</header>
<main>
  <section class="card wide"><h2>Documents published per week</h2><div class="box"><canvas id="weekly"></canvas></div></section>
  <section class="card"><h2>Top 10 agencies</h2><div class="box"><canvas id="agencies"></canvas></div></section>
  <section class="card"><h2>Document length (pages)</h2><div class="box"><canvas id="lengths"></canvas></div></section>
</main>
<script>
let rows = [], charts = {};

Papa.parse("data/documents.csv", {
  download: true, header: true, skipEmptyLines: true, dynamicTyping: true,
  complete: res => {
    rows = res.data;
    const types = [...new Set(rows.map(r => r.type))].sort();
    document.getElementById("type").innerHTML += types.map(t => `<option>${t}</option>`).join("");
    draw();
  },
});
document.getElementById("type").addEventListener("change", draw);

// Monday of the week a date falls in, as YYYY-MM-DD
function weekStart(iso) {
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d.toISOString().slice(0, 10);
}

function count(items, keyFn) {
  const out = {};
  items.forEach(i => { const k = keyFn(i); out[k] = (out[k] || 0) + 1; });
  return out;
}

function show(id, config) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), config);
}

function draw() {
  const type = document.getElementById("type").value;
  const data = type ? rows.filter(r => r.type === type) : rows;
  const dates = rows.map(r => r.publication_date).sort();
  document.getElementById("summary").textContent =
    `${data.length.toLocaleString()} documents, ${dates[0]} to ${dates[dates.length - 1]}. Source: federalregister.gov API`;

  const weekly = count(data, r => weekStart(r.publication_date));
  const weeks = Object.keys(weekly).sort();
  show("weekly", {
    type: "line",
    data: { labels: weeks, datasets: [{ data: weeks.map(w => weekly[w]), borderColor: "#1f6feb", tension: 0.2 }] },
    options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } },
  });

  const byAgency = Object.entries(count(data, r => r.agency)).sort((a, b) => b[1] - a[1]).slice(0, 10);
  show("agencies", {
    type: "bar",
    data: { labels: byAgency.map(a => a[0]), datasets: [{ data: byAgency.map(a => a[1]), backgroundColor: "#1f6feb" }] },
    options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false } } },
  });

  const buckets = [["1", 1, 1], ["2", 2, 2], ["3-5", 3, 5], ["6-10", 6, 10], ["11-50", 11, 50], ["51+", 51, Infinity]];
  show("lengths", {
    type: "bar",
    data: {
      labels: buckets.map(b => b[0]),
      datasets: [{ data: buckets.map(([, lo, hi]) => data.filter(r => r.pages >= lo && r.pages <= hi).length), backgroundColor: "#1f6feb" }],
    },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } } },
  });
}
</script>
</body>
</html>
